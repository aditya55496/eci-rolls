name: uk-2026-p2-ingest
on:
  workflow_dispatch:
    inputs:
      acs:
        description: "ACs to ingest (e.g. 21 or 1,21 or 1-70)"
        required: true
        default: "1"
      shard_parts:
        description: "Max listed draft parts per shard (ACs above this auto-split)"
        required: false
        default: "200"
      model_set:
        description: "OCR model set from model_sets.json (v4a = hinted, 5x less CPU; j2Ps = no-hint)"
        required: false
        default: "v4a"
      pull_hints:
        description: "Pull 2027 SSR text-layer hints per AC (required by v4a) — true/false"
        required: false
        default: "true"
      public:
        description: "Emit the PII-safe HMAC'd public Parquet release — true/false"
        required: false
        default: "true"
permissions:
  contents: read
  actions: read          # plan lists prior clean artifacts; reduce downloads this run's shards
jobs:
  # ---- plan: sweep part counts (gateway only), auto-shard, skip already-done ACs ----
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
      acs: ${{ steps.plan.outputs.acs }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan deps (crypto + requests for the gateway part-list)
        run: pip install -q cryptography requests
      - id: plan
        env:
          ACS: ${{ inputs.acs }}
          SHARD_PARTS: ${{ inputs.shard_parts }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resume: ACs whose clean merged artifact uk-2026-agg-ac-<n> already exists (prior runs)
          DONE=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].name' | sed -n 's/^uk-2026-agg-ac-\([0-9][0-9]*\)$/\1/p' \
            | sort -un | paste -sd, -)
          echo "done ACs: ${DONE:-none}"
          python -u uk/uk_2026.py plan --acs "$ACS" --shard-parts "${SHARD_PARTS:-200}" \
            ${DONE:+--done-acs "$DONE"}

  # ---- ingest: one matrix cell per (AC, part-range) shard ----
  ingest:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps (Tesseract 5 + Hindi/English data)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng
          ls -l /usr/share/tesseract-ocr/5/tessdata/hin.traineddata /usr/share/tesseract-ocr/5/tessdata/eng.traineddata
      - name: Python deps
        run: pip install -q -r requirements.txt
      - name: Ingest AC ${{ matrix.cell.ac }} shard ${{ matrix.cell.tag }}
        env:
          AC: ${{ matrix.cell.ac }}
          LO: ${{ matrix.cell.lo }}
          HI: ${{ matrix.cell.hi }}
          MODEL_SET: ${{ inputs.model_set }}
          PULL_HINTS: ${{ inputs.pull_hints }}
          PUBLIC: ${{ inputs.public }}
          EPIC_HMAC_SALT: ${{ secrets.EPIC_HMAC_SALT }}
        run: |
          RANGE=""
          if [ "$LO" != "0" ] || [ "$HI" != "0" ]; then RANGE="--part-range ${LO}-${HI}"; fi
          EXTRA=""
          if [ -n "$MODEL_SET" ]; then EXTRA="$EXTRA --model-set $MODEL_SET"; fi
          if [ "$PULL_HINTS" = "true" ]; then EXTRA="$EXTRA --pull-2027-hints"; fi
          if [ "$PUBLIC" = "true" ]; then EXTRA="$EXTRA --public-out public_out"; fi
          echo "Ingesting AC $AC range='${RANGE:-full}' flags='$EXTRA'"
          python -u uk/uk_2026.py ingest --acs "$AC" --out ./out $RANGE $EXTRA
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: uk-2026-shard-${{ matrix.cell.tag }}   # absent when the shard was incomplete (no file written)
          path: out/aggregates/2026/ac=*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.public == 'true' }}
        with:
          name: uk-2026-public-${{ matrix.cell.tag }}   # PII-safe: HMAC'd, allowlisted Parquet + tok
          path: public_out/release/**
          if-no-files-found: ignore

  # ---- reduce: merge each AC's shards -> PII-safe ac={n}.json (clean ACs only) ----
  reduce:
    needs: [plan, ingest]
    if: ${{ always() && needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        ac: ${{ fromJSON(needs.plan.outputs.acs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps (eci_api needs cryptography+requests at import; pyarrow for public concat)
        run: pip install -q -r requirements.txt
      - name: Download this run's shard aggregates
        uses: actions/download-artifact@v4
        with:
          pattern: uk-2026-shard-*
          path: shards
      - name: Download this run's public shards
        if: ${{ inputs.public == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: uk-2026-public-*
          path: public_shards
      - name: Merge AC ${{ matrix.ac }} shards -> ac=${{ matrix.ac }}.json (+ public concat)
        env:
          CELLS: ${{ needs.plan.outputs.cells }}
          AC: ${{ matrix.ac }}
          PUBLIC: ${{ inputs.public }}
        run: |
          PUB=""
          if [ "$PUBLIC" = "true" ]; then PUB="--public-dir public_shards"; fi
          python -u uk/uk_2026.py reduce --acs "$AC" --shard-dir shards --out ./out --expect "$CELLS" $PUB
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: uk-2026-agg-ac-${{ matrix.ac }}    # clean merged AC -> plan skips it on the next dispatch
          path: out/aggregates/2026/ac=${{ matrix.ac }}.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.public == 'true' }}
        with:
          name: uk-2026-public-ac-${{ matrix.ac }}  # merged PII-safe release (full-AC diff flags recomputed)
          path: out/release/**
          if-no-files-found: ignore
